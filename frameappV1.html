<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame Card Practice</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px;
    color: #000;
    background: #fff;
    line-height: 1.4;
  }
  h1 { font-size: 1.3em; border-bottom: 2px solid #000; padding-bottom: 8px; }
  h2 { font-size: 1.05em; margin-top: 0; }
  .note { font-size: 0.85em; color: #333; }
  section {
    display: none;
    border: 1px solid #000;
    padding: 16px;
    margin-bottom: 16px;
  }
  section.active { display: block; }
  fieldset { border: 1px solid #000; margin-bottom: 12px; }
  legend { font-weight: bold; padding: 0 4px; }
  label { display: block; margin: 6px 0; }
  select {
    font-family: inherit;
    font-size: 0.95em;
    width: 100%;
    border: 1px solid #000;
    padding: 4px;
  }
  button {
    font-size: 1em;
    padding: 8px 14px;
    margin: 4px 4px 4px 0;
    border: 2px solid #000;
    background: #fff;
    color: #000;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #000; color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: #000; color: #fff; }
  button.primary:hover:not(:disabled) { background: #333; }
  #choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .choice-btn { min-width: 56px; font-size: 1.1em; }
  .choice-btn.correct { background: #000; color: #fff; }
  .choice-btn.incorrect { text-decoration: line-through; }
  #cardWrap { text-align: center; border: 1px dashed #000; padding: 10px; }
  #feedback { font-weight: bold; min-height: 1.4em; margin-top: 10px; }
  #statusLine { font-weight: bold; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { border: 1px solid #000; padding: 4px 8px; text-align: left; font-size: 0.85em; vertical-align: top; }
  th { background: #eee; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>Frame Card Practice</h1>
<p class="note">Functional mockup — black &amp; white pass. Card set generated: <span id="genStamp"></span></p>

<!-- ===================== SETUP ===================== -->
<section id="setup" class="active">
  <h2>Choose mode &amp; card set</h2>
  <div id="poolSummary" class="note"></div>

  <fieldset>
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="practice" checked> Free Practice — 10 random questions</label>
    <label><input type="radio" name="mode" value="timed"> Timed — 1 minute, as many as possible</label>
    <label><input type="radio" name="mode" value="survival"> Survival — ends on first miss</label>
  </fieldset>

  <label for="cardTypeSelect">Card Type</label>
  <select id="cardTypeSelect"></select>

  <div>
    <button id="startBtn" class="primary" disabled>Start</button>
  </div>
</section>

<!-- ===================== PLAY ===================== -->
<section id="play">
  <div id="statusLine"></div>
  <div id="cardWrap"></div>
  <p style="text-align:center; margin: 6px 0 0;">How many?</p>
  <div id="choices" role="group" aria-label="Answer choices"></div>
  <div id="feedback" role="status" aria-live="polite"></div>
</section>

<!-- ===================== RESULTS ===================== -->
<section id="results">
  <h2>Scorecard</h2>
  <div id="summaryBox"></div>
  <h3>Attempt Detail</h3>
  <table id="attemptTable">
    <thead>
      <tr><th>#</th><th>Correct Value</th><th>Choices Shown</th><th>Attempts (in order)</th><th>First Try?</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div style="margin-top:12px;">
    <button id="downloadScoreBtn" class="primary">Download Scorecard (JSON)</button>
    <button id="restartBtn">New Session</button>
  </div>
</section>

  // ---------- Card rendering (index-order fill, per Frame_Card_Format_Spec.md §4 fallback) ----------
  function gridSVG(cols, rows, x0, y0, cellW, cellH, dotR, fillOffset, fillCount) {
    var g = "";
    for (var r = 0; r <= rows; r++) {
      var y = y0 + r * cellH;
      g += '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0 + cols * cellW) + '" y2="' + y + '" stroke="#888888" stroke-width="1.5"/>';
    }
    for (var c = 0; c <= cols; c++) {
      var x = x0 + c * cellW;
      g += '<line x1="' + x + '" y1="' + y0 + '" x2="' + x + '" y2="' + (y0 + rows * cellH) + '" stroke="#888888" stroke-width="1.5"/>';
    }
    for (var rr = 0; rr < rows; rr++) {
      for (var cc = 0; cc < cols; cc++) {
        var idx = rr * cols + cc;
        var globalIdx = fillOffset + idx;
        if (globalIdx < fillCount) {
          var cx = x0 + cc * cellW + cellW / 2;
          var cy = y0 + rr * cellH + cellH / 2;
          g += '<circle cx="' + cx + '" cy="' + cy + '" r="' + dotR + '" fill="#000000"/>';
        }
      }
    }
    return g;
  }

  function cardSVG(cardType, value) {
    var W = 216, H = 288;
    var inner = '<rect x="1" y="1" width="214" height="286" rx="14" fill="#ffffff" stroke="#000000" stroke-width="2"/>';
    if (cardType === "fiveframe") {
      inner += gridSVG(1, 5, 78, 40, 60, 41.6, 12, 0, value);
    } else if (cardType === "tenframe") {
      inner += gridSVG(2, 5, 48, 40, 60, 41.6, 12, 0, value);
    } else if (cardType === "doubletenframe") {
      // Bottom grid origin uses top_y0 + 2*cellH + 18 (explicit 18px gap) so the
      // two grids render as visually separate sets, per spec §1 / §3.4 intent.
      inner += gridSVG(5, 2, 24, 46, 33.6, 46, 10.5, 0, value);
      inner += gridSVG(5, 2, 24, 156, 33.6, 46, 10.5, 10, value);
    }
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="220" height="293" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frame card showing ' + value + '">' + inner + '</svg>';
  }

  // ---------- Utilities ----------
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ---------- Session state ----------
  var currentMode = null;
  var currentCardType = null;
  var sessionQuestions = [];
  var practiceQueue = [];
  var practiceIndex = 0;
  var currentQuestion = null;
  var timerInterval = null;
  var timeRemaining = 60;
  var sessionStart = null;

  function newQuestionRecord(sourceQ) {
    return {
      cardType: sourceQ.cardType,
      correct: sourceQ.correct,
      choices: shuffle([sourceQ.correct].concat(sourceQ.distractors)),
      attempts: [],
      solvedOnFirstTry: false,
      completed: false
    };
  }

  var lastCorrectValue = null; // tracks the correct value of the immediately preceding question, across modes

  function pickRandomSource(cardType) {
    var pool = QUESTION_POOL[cardType];
    var candidates = pool.filter(function(q){ return q.correct !== lastCorrectValue; });
    if (candidates.length === 0) candidates = pool; // only possible if every card in the pool shares one value
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    lastCorrectValue = pick.correct;
    return pick;
  }

  // Builds a fixed-length queue (always `count` questions, drawing with replacement
  // if the pool is smaller) with no two consecutive entries sharing a correct value.
  function buildNoRepeatQueue(cardType, count) {
    var pool = QUESTION_POOL[cardType];
    var queue = [];
    var prevCorrect = null;
    for (var i = 0; i < count; i++) {
      var candidates = pool.filter(function(q){ return q.correct !== prevCorrect; });
      if (candidates.length === 0) candidates = pool;
      var pick = candidates[Math.floor(Math.random() * candidates.length)];
      queue.push(pick);
      prevCorrect = pick.correct;
    }
    return queue;
  }

  function startSession(mode, cardType) {
    currentMode = mode;
    currentCardType = cardType;
    sessionQuestions = [];
    currentQuestion = null;
    sessionStart = Date.now();

    document.getElementById("setup").classList.remove("active");
    document.getElementById("results").classList.remove("active");
    document.getElementById("play").classList.add("active");

    lastCorrectValue = null;

    if (mode === "practice") {
      practiceQueue = buildNoRepeatQueue(cardType, 10); // always 10 per spec, repeats allowed if pool is smaller
      practiceIndex = 0;
      presentNext();
    } else if (mode === "timed") {
      timeRemaining = 60;
      startTimer();
      presentNext();
    } else if (mode === "survival") {
      presentNext();
    }
  }

  function startTimer() {
    updateTimerDisplay();
    timerInterval = setInterval(function(){
      timeRemaining--;
      updateTimerDisplay();
      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        finalizeInProgressQuestion(false);
        endSession("time_up");
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    if (currentMode === "timed") {
      document.getElementById("statusLine").textContent =
        "Timed Mode — " + timeRemaining + "s remaining — Correct so far: " + sessionQuestions.filter(function(q){return q.completed;}).length;
    }
  }

  function presentNext() {
    var sourceQ = null;

    if (currentMode === "practice") {
      if (practiceIndex >= practiceQueue.length) { endSession("completed"); return; }
      sourceQ = practiceQueue[practiceIndex];
    } else {
      sourceQ = pickRandomSource(currentCardType);
    }

    currentQuestion = newQuestionRecord(sourceQ);
    renderQuestion();
  }

  function renderQuestion() {
    document.getElementById("feedback").textContent = "";
    document.getElementById("cardWrap").innerHTML = cardSVG(currentQuestion.cardType, currentQuestion.correct);

    var choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";
    currentQuestion.choices.forEach(function(val){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = val;
      btn.addEventListener("click", function(){ handleAnswer(val, btn); });
      choicesDiv.appendChild(btn);
    });

    if (currentMode === "practice") {
      document.getElementById("statusLine").textContent =
        "Free Practice — Question " + (practiceIndex + 1) + " of " + practiceQueue.length;
    } else if (currentMode === "survival") {
      document.getElementById("statusLine").textContent =
        "Survival — Streak: " + sessionQuestions.filter(function(q){return q.completed;}).length;
    } else if (currentMode === "timed") {
      updateTimerDisplay();
    }
  }

  function disableAllChoiceButtons() {
    var btns = document.querySelectorAll("#choices .choice-btn");
    btns.forEach(function(b){ b.disabled = true; });
  }

  function showFeedback(text) {
    document.getElementById("feedback").textContent = text;
  }

  function handleAnswer(selectedValue, btnEl) {
    var q = currentQuestion;
    var isCorrect = selectedValue === q.correct;
    q.attempts.push({
      attemptNumber: q.attempts.length + 1,
      selected: selectedValue,
      result: isCorrect ? "correct" : "incorrect",
      timestamp: new Date().toISOString()
    });

    if (isCorrect) {
      btnEl.classList.add("correct");
      disableAllChoiceButtons();
      showFeedback("Correct!");
      q.solvedOnFirstTry = q.attempts.length === 1;
      q.completed = true;
      sessionQuestions.push(q);
      setTimeout(advanceAfterCorrect, 600);
    } else {
      btnEl.classList.add("incorrect");
      btnEl.disabled = true;
      if (currentMode === "survival") {
        showFeedback("Incorrect. Survival run ended.");
        q.solvedOnFirstTry = false;
        q.completed = false;
        sessionQuestions.push(q);
        disableAllChoiceButtons();
        setTimeout(function(){ endSession("incorrect"); }, 900);
      } else {
        showFeedback("Not quite — try again.");
      }
    }
  }

  function advanceAfterCorrect() {
    if (currentMode === "practice") {
      practiceIndex++;
      presentNext();
    } else if (currentMode === "timed") {
      if (timeRemaining > 0) presentNext();
    } else if (currentMode === "survival") {
      presentNext();
    }
  }

  function finalizeInProgressQuestion(wasCorrect) {
    if (currentQuestion && !currentQuestion.completed && sessionQuestions.indexOf(currentQuestion) === -1) {
      currentQuestion.completed = wasCorrect;
      sessionQuestions.push(currentQuestion);
    }
  }

  function endSession(reason) {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    var sessionEnd = Date.now();

    document.getElementById("play").classList.remove("active");
    document.getElementById("results").classList.add("active");

    var totalQuestions = sessionQuestions.length;
    var correctCount = sessionQuestions.filter(function(q){ return q.completed; }).length;
    var incorrectCount = totalQuestions - correctCount;
    var totalAttempts = sessionQuestions.reduce(function(s,q){ return s + q.attempts.length; }, 0);
    var firstTryCount = sessionQuestions.filter(function(q){ return q.solvedOnFirstTry; }).length;
    var durationSeconds = Math.round((sessionEnd - sessionStart) / 1000);

    window.__lastScorecard = {
      mode: currentMode,
      cardType: currentCardType,
      endReason: reason,
      startTime: new Date(sessionStart).toISOString(),
      endTime: new Date(sessionEnd).toISOString(),
      durationSeconds: durationSeconds,
      summary: {
        totalQuestions: totalQuestions,
        correctCount: correctCount,
        incorrectCount: incorrectCount,
        totalAttempts: totalAttempts,
        firstTryCount: firstTryCount
      },
      questions: sessionQuestions.map(function(q, i){
        return {
          index: i + 1,
          cardType: q.cardType,
          correctValue: q.correct,
          choicesShown: q.choices,
          attempts: q.attempts,
          solvedOnFirstTry: q.solvedOnFirstTry,
          totalAttempts: q.attempts.length,
          completed: q.completed
        };
      })
    };

    renderResults(window.__lastScorecard);
  }

  function renderResults(sc) {
    document.getElementById("summaryBox").innerHTML =
      "<strong>Mode:</strong> " + sc.mode + " &nbsp;|&nbsp; " +
      "<strong>Card Set:</strong> " + TYPE_LABELS[sc.cardType] + " &nbsp;|&nbsp; " +
      "<strong>Duration:</strong> " + sc.durationSeconds + "s<br>" +
      "<strong>Questions:</strong> " + sc.summary.totalQuestions + " &nbsp;|&nbsp; " +
      "<strong>Correct:</strong> " + sc.summary.correctCount + " &nbsp;|&nbsp; " +
      "<strong>Incorrect (ended run):</strong> " + sc.summary.incorrectCount + " &nbsp;|&nbsp; " +
      "<strong>Total Attempts:</strong> " + sc.summary.totalAttempts + " &nbsp;|&nbsp; " +
      "<strong>Solved First Try:</strong> " + sc.summary.firstTryCount;

    var tbody = document.querySelector("#attemptTable tbody");
    tbody.innerHTML = "";
    sc.questions.forEach(function(q){
      var tr = document.createElement("tr");
      var attemptsStr = q.attempts.map(function(a){
        return a.selected + (a.result === "correct" ? "\u2713" : "\u2717");
      }).join(" \u2192 ");
      tr.innerHTML =
        "<td>" + q.index + "</td>" +
        "<td>" + q.correctValue + "</td>" +
        "<td>" + q.choicesShown.join(", ") + "</td>" +
        "<td>" + attemptsStr + "</td>" +
        "<td>" + (q.solvedOnFirstTry ? "Yes" : "No") + "</td>";
      tbody.appendChild(tr);
    });
  }

  // ---------- Setup screen wiring ----------
  function populateCardTypeSelect() {
    var sel = document.getElementById("cardTypeSelect");
    sel.innerHTML = "";
    var any = false;
    var counts = [];
    Object.keys(TYPE_LABELS).forEach(function(k){
      var n = (QUESTION_POOL[k] || []).length;
      counts.push(TYPE_LABELS[k] + ": " + n + " card(s)");
      var opt = document.createElement("option");
      opt.value = k;
      opt.textContent = TYPE_LABELS[k] + " (" + n + " card" + (n === 1 ? "" : "s") + ")";
      if (n === 0) opt.disabled = true; else any = true;
      sel.appendChild(opt);
    });
    document.getElementById("poolSummary").textContent = counts.join(" | ");
    document.getElementById("startBtn").disabled = !any;
  }

  document.getElementById("startBtn").addEventListener("click", function(){
    var mode = document.querySelector('input[name="mode"]:checked').value;
    var cardType = document.getElementById("cardTypeSelect").value;
    startSession(mode, cardType);
  });

  document.getElementById("downloadScoreBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(window.__lastScorecard, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    var ts = new Date().toISOString().replace(/[:.]/g, "-");
    a.download = "scorecard_" + window.__lastScorecard.mode + "_" + ts + ".json";
    a.click();
  });

  document.getElementById("restartBtn").addEventListener("click", function(){
    document.getElementById("results").classList.remove("active");
    document.getElementById("setup").classList.add("active");
